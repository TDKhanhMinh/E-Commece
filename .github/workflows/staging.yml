name: Deploy to Staging

# Workflow này deploy lên staging environment
# Trigger: Push vào branch 'develop' hoặc manual dispatch

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: trandokhanhminh/next-ecommerce-backend
  IMAGE_FRONTEND: trandokhanhminh/next-ecommerce-frontend

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Quick CI - Chỉ build, không chạy full tests
  # ─────────────────────────────────────────────────────────────────────────────
  quick-ci:
    name: Quick CI Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build backend (skip tests)
        working-directory: back-end
        run: mvn package -DskipTests -B

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - name: Build frontend
        working-directory: front-end
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.STAGING_API_URL || 'http://localhost:5000/api' }}
          NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${{ secrets.STAGING_PAYPAL_CLIENT_ID || 'test' }}
        run: |
          npm ci
          npm run build

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Build & Push Docker images với tag 'staging'
  # ─────────────────────────────────────────────────────────────────────────────
  docker-build-push:
    name: Build & Push (Staging)
    runs-on: ubuntu-latest
    needs: quick-ci

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Backend
      - name: Build & push backend (staging)
        uses: docker/build-push-action@v5
        with:
          context: ./back-end
          file: ./back-end/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Frontend
      - name: Build & push frontend (staging)
        uses: docker/build-push-action@v5
        with:
          context: ./front-end
          file: ./front-end/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:staging-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.STAGING_API_URL }}
            NEXT_PUBLIC_PAYPAL_CLIENT_ID=${{ secrets.STAGING_PAYPAL_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Deploy to Staging Server
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-build-push
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_BACKEND: ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:staging
          IMAGE_FRONTEND: ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:staging
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: REGISTRY,IMAGE_BACKEND,IMAGE_FRONTEND,GITHUB_TOKEN,GITHUB_ACTOR
          script: |
            set -e
            cd ~/app-staging

            # Update .env for staging
            cat > .env <<'EOF'
            MYSQL_ROOT_PASSWORD=${{ secrets.STAGING_MYSQL_ROOT_PASSWORD }}
            MYSQL_DATABASE=${{ secrets.STAGING_MYSQL_DATABASE }}
            MYSQL_USER=${{ secrets.STAGING_MYSQL_USER }}
            MYSQL_PASSWORD=${{ secrets.STAGING_MYSQL_PASSWORD }}
            JWT_SECRET=${{ secrets.STAGING_JWT_SECRET }}
            JWT_EXPIRATION=${{ secrets.JWT_EXPIRATION }}
            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            NEXT_PUBLIC_API_URL=${{ secrets.STAGING_API_URL }}
            NEXT_PUBLIC_PAYPAL_CLIENT_ID=${{ secrets.STAGING_PAYPAL_CLIENT_ID }}
            BACKEND_IMAGE=${IMAGE_BACKEND}
            FRONTEND_IMAGE=${IMAGE_FRONTEND}
            EOF

            # Login and pull
            echo "${GITHUB_TOKEN}" | docker login ${REGISTRY} -u ${GITHUB_ACTOR} --password-stdin
            docker compose -f docker-compose.prod.yml pull

            # Deploy
            docker compose -f docker-compose.prod.yml up -d --remove-orphans --wait
            docker compose -f docker-compose.prod.yml ps

            # Cleanup
            docker image prune -af --filter "until=24h"

            echo "✅ Staging deployment completed!"

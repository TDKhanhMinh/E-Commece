name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: tdkhanhminh/next-ecommerce-backend
  IMAGE_FRONTEND: tdkhanhminh/next-ecommerce-frontend

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1: CI Backend — Build & Test (Spring Boot)
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  ci-backend:
    name: CI — Backend (Spring Boot)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: rootpassword
          POSTGRES_DB: next_ecommerce
          POSTGRES_USER: springstudent
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U springstudent -d next_ecommerce"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
          
      - name: Inject Firebase Service Account Key
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -z "$FIREBASE_KEY" ]; then
            echo "❌ ERROR: Secret FIREBASE_SERVICE_ACCOUNT_KEY is not set or empty!"
            exit 1
          fi
          mkdir -p back-end/src/main/resources
          printf '%s' "$FIREBASE_KEY" > back-end/src/main/resources/serviceAccountKey.json
          echo "✅ serviceAccountKey.json written ($(wc -c < back-end/src/main/resources/serviceAccountKey.json) bytes)"
          
      - name: Build & run tests
        working-directory: back-end
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/next_ecommerce
          SPRING_DATASOURCE_USERNAME: springstudent
          SPRING_DATASOURCE_PASSWORD: rootpassword
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION: 360000000
          SPRING_MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          SPRING_MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: mvn clean package -B -DskipTests

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: back-end/target/surefire-reports/

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: CI Frontend — Lint & Build (Next.js)
  # ─────────────────────────────────────────────────────────────────────────────
  ci-frontend:
    name: CI — Frontend (Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - name: Install dependencies
        working-directory: front-end
        run: npm ci

      - name: Lint
        working-directory: front-end
        run: npm run lint || true

      - name: Build (type-check + Next.js build)
        working-directory: front-end
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:5000/api' }}
          NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_PAYPAL_CLIENT_ID || 'test' }}
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Build & Push Docker images lên GHCR
  # ─────────────────────────────────────────────────────────────────────────────
  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [ci-backend, ci-frontend]
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    outputs:
      backend-tag: ${{ steps.meta-backend.outputs.version }}
      frontend-tag: ${{ steps.meta-frontend.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Inject Firebase Service Account Key
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -z "$FIREBASE_KEY" ]; then
            echo "❌ ERROR: Secret FIREBASE_SERVICE_ACCOUNT_KEY is not set or empty!"
            exit 1
          fi
          mkdir -p back-end/src/main/resources
          printf '%s' "$FIREBASE_KEY" > back-end/src/main/resources/serviceAccountKey.json

      # ── Backend image ──────────────────────────────────────────────────────
      - name: Extract metadata for backend image
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./back-end
          file: ./back-end/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend image ─────────────────────────────────────────────────────
      - name: Extract metadata for frontend image
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./front-end
          file: ./front-end/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_PAYPAL_CLIENT_ID=${{ secrets.NEXT_PUBLIC_PAYPAL_CLIENT_ID }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_FIREBASE_VAPID_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4: Deploy (Docker Swarm) to VPS
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS Docker Swarm
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg | sudo tee /usr/share/keyrings/cloudflare-main.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main" | sudo tee /etc/apt/sources.list.d/cloudflared.list
          sudo apt-get update && sudo apt-get install -y cloudflared

      - name: Setup SSH config for Cloudflare Tunnel
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config <<EOF
          Host ${{ secrets.DEPLOY_SSH_HOSTNAME }}
            HostName ${{ secrets.DEPLOY_SSH_HOSTNAME }}
            User ${{ secrets.DEPLOY_USER }}
            IdentityFile ~/.ssh/id_ed25519
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

      - name: Test SSH connection
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_SSH_HOSTNAME }} "echo '✅ SSH connection successful!'"

      - name: Create deployment environment file
        env:
          BACKEND_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ needs.docker-build-push.outputs.backend-tag }}
          FRONTEND_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ needs.docker-build-push.outputs.frontend-tag }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          # JWT
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION }}
          # Mail
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          # Cloudinary
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          # VnPay
          VNPAY_TMN_CODE: ${{ secrets.VNPAY_TMN_CODE }}
          VNPAY_HASH_SECRET: ${{ secrets.VNPAY_HASH_SECRET }}
          VNPAY_RETURN_URL: ${{ secrets.VNPAY_RETURN_URL }}
          # PayPal
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_RETURN_URL: ${{ secrets.PAYPAL_RETURN_URL }}
          PAYPAL_CANCEL_URL: ${{ secrets.PAYPAL_CANCEL_URL }}
        run: |
          {
            printf 'BACKEND_IMAGE=%s\n'           "$BACKEND_IMAGE"
            printf 'FRONTEND_IMAGE=%s\n'          "$FRONTEND_IMAGE"
            printf 'CLOUDFLARE_TUNNEL_TOKEN=%s\n' "$CLOUDFLARE_TUNNEL_TOKEN"
            printf 'JWT_SECRET=%s\n'              "$JWT_SECRET"
            printf 'JWT_EXPIRATION=%s\n'          "${JWT_EXPIRATION:-360000000}"
            printf 'MAIL_USERNAME=%s\n'           "$MAIL_USERNAME"
            printf 'MAIL_PASSWORD=%s\n'           "$MAIL_PASSWORD"
            printf 'CLOUDINARY_CLOUD_NAME=%s\n'   "$CLOUDINARY_CLOUD_NAME"
            printf 'CLOUDINARY_API_KEY=%s\n'      "$CLOUDINARY_API_KEY"
            printf 'CLOUDINARY_API_SECRET=%s\n'   "$CLOUDINARY_API_SECRET"
            printf 'VNPAY_TMN_CODE=%s\n'          "$VNPAY_TMN_CODE"
            printf 'VNPAY_HASH_SECRET=%s\n'       "$VNPAY_HASH_SECRET"
            printf 'VNPAY_RETURN_URL=%s\n'        "${VNPAY_RETURN_URL:-https://www.voipelearning.shop/en/user/orders}"
            printf 'PAYPAL_CLIENT_ID=%s\n'        "$PAYPAL_CLIENT_ID"
            printf 'PAYPAL_CLIENT_SECRET=%s\n'    "$PAYPAL_CLIENT_SECRET"
            printf 'PAYPAL_RETURN_URL=%s\n'       "${PAYPAL_RETURN_URL:-https://www.voipelearning.shop/en/user/orders}"
            printf 'PAYPAL_CANCEL_URL=%s\n'       "${PAYPAL_CANCEL_URL:-https://www.voipelearning.shop/en/user/orders}"
          } > .env

      - name: Sync deployment files to server
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_SSH_HOSTNAME }} "mkdir -p ~/app"
          scp docker-stack.yml docker-stack.monitor.yml .env ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_SSH_HOSTNAME }}:~/app/
          scp -r nginx prometheus grafana scripts ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_SSH_HOSTNAME }}:~/app/

      - name: Deploy Swarm Stacks
        env:
          BACKEND_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ needs.docker-build-push.outputs.backend-tag }}
          FRONTEND_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ needs.docker-build-push.outputs.frontend-tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          GHCR_REGISTRY: ${{ env.REGISTRY }}
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_SSH_HOSTNAME }} \
            FRONTEND_IMAGE="$FRONTEND_IMAGE" BACKEND_IMAGE="$BACKEND_IMAGE" \
            GHCR_TOKEN="$GHCR_TOKEN" GHCR_USER="$GHCR_USER" GHCR_REGISTRY="$GHCR_REGISTRY" \
            bash << 'ENDSSH'
              set -e
              cd ~/app

              echo "Backend image set to:  $BACKEND_IMAGE"
              echo "Frontend image set to: $FRONTEND_IMAGE"

              # 1. Đăng nhập vào GHCR để Swarm có thể pull images từ private registry
              echo "$GHCR_TOKEN" | docker login "$GHCR_REGISTRY" -u "$GHCR_USER" --password-stdin

              # Load environment variables from .env
              set -a
              [ -f .env ] && source .env
              set +a

              # 2. Xóa và tạo lại nginx configs (Docker configs là immutable)
              echo "Updating nginx configs..."
              # Xóa nginx service trước để có thể xóa configs
              docker service rm mystack_nginx 2>/dev/null || true
              sleep 2
              # Xóa configs cũ
              docker config rm mystack_nginx_conf mystack_nginx_app_conf 2>/dev/null || true
              # Tạo configs mới
              docker config create mystack_nginx_conf nginx/nginx.conf
              docker config create mystack_nginx_app_conf nginx/conf.d/app.conf

              # 3. Triển khai App Stack và Monitoring Stack
              docker stack deploy -c docker-stack.yml --with-registry-auth mystack
              docker stack deploy -c docker-stack.monitor.yml mystack-monitor

              # 4. Kích hoạt quyền cho scripts
              chmod +x scripts/autoscaler.py scripts/backup-postgres.sh

              # 5. Gắn Cron job cho Auto-scaler & Backup (xóa cũ, nạp mới)
              (crontab -l 2>/dev/null | grep -v 'autoscaler.py\|backup-postgres.sh' || true; \
              echo "*/2 * * * * python3 $(pwd)/scripts/autoscaler.py >> /var/log/swarm_autoscaler.log 2>&1"; \
              echo "0 2 * * * $(pwd)/scripts/backup-postgres.sh >> /var/log/postgres_backup.log 2>&1" \
              ) | crontab -

              # 6. Dọn dẹp rác
              docker image prune -af --filter "until=24h"

              echo "✅ Docker Swarm deployment and maintenance scheduling completed successfully!"
          ENDSSH

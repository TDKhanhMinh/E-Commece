name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # Cho phép trigger thủ công

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: tdkhanhminh/next-ecommerce-backend
  IMAGE_FRONTEND: tdkhanhminh/next-ecommerce-frontend

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1: CI Backend — Build & Test (Spring Boot)
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  ci-backend:
    name: CI — Backend (Spring Boot)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: next_ecommerce
          MYSQL_USER: springstudent
          MYSQL_PASSWORD: springstudent
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build & run tests
        working-directory: back-end
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/next_ecommerce?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: springstudent
          SPRING_DATASOURCE_PASSWORD: springstudent
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION: 360000000
          SPRING_MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          SPRING_MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: mvn verify -B

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: back-end/target/surefire-reports/

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: CI Frontend — Lint & Build (Next.js)
  # ─────────────────────────────────────────────────────────────────────────────
  ci-frontend:
    name: CI — Frontend (Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - name: Install dependencies
        working-directory: front-end
        run: npm ci

      - name: Lint
        working-directory: front-end
        run: npm run lint || true  # Tạm thời cho phép lint fail

      - name: Build (type-check + Next.js build)
        working-directory: front-end
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:5000/api' }}
          NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_PAYPAL_CLIENT_ID || 'test' }}
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Build & Push Docker images lên GitHub Container Registry
  # Chỉ chạy khi push vào main/master (không chạy trên PR)
  # ─────────────────────────────────────────────────────────────────────────────
  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [ci-backend, ci-frontend]
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    outputs:
      backend-tag: ${{ steps.meta-backend.outputs.version }}
      frontend-tag: ${{ steps.meta-frontend.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Backend image ──────────────────────────────────────────────────────
      - name: Extract metadata for backend image
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./back-end
          file: ./back-end/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend image ─────────────────────────────────────────────────────
      - name: Extract metadata for frontend image
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./front-end
          file: ./front-end/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_PAYPAL_CLIENT_ID=${{ secrets.NEXT_PUBLIC_PAYPAL_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4: Deploy lên VPS qua Cloudflare Tunnel
  # Yêu cầu Secrets:
  #   DEPLOY_SSH_HOSTNAME  - SSH hostname qua Cloudflare (VD: ssh.voipelearning.shop)
  #   DEPLOY_USER          - SSH username (VD: root)
  #   DEPLOY_SSH_KEY       - Private SSH key
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg | sudo tee /usr/share/keyrings/cloudflare-main.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main" | sudo tee /etc/apt/sources.list.d/cloudflared.list
          sudo apt-get update && sudo apt-get install -y cloudflared

      - name: Setup SSH config for Cloudflare Tunnel
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Ghi SSH private key
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Cấu hình SSH dùng cloudflared làm ProxyCommand
          cat >> ~/.ssh/config <<EOF
          Host ${{ secrets.DEPLOY_SSH_HOSTNAME }}
            HostName ${{ secrets.DEPLOY_SSH_HOSTNAME }}
            User ${{ secrets.DEPLOY_USER }}
            IdentityFile ~/.ssh/id_ed25519
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

      - name: Test SSH connection
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_SSH_HOSTNAME }} "echo '✅ SSH connection successful!'"

      - name: Copy docker-compose files to server
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_SSH_HOSTNAME }} "mkdir -p ~/app"
          scp docker-compose.prod.yml ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_SSH_HOSTNAME }}:~/app/docker-compose.prod.yml

      - name: Write .env and deploy to server
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_PAYPAL_CLIENT_ID }}
          VNPAY_RETURN_URL: ${{ secrets.VNPAY_RETURN_URL }}
          PAYPAL_RETURN_URL: ${{ secrets.PAYPAL_RETURN_URL }}
          PAYPAL_CANCEL_URL: ${{ secrets.PAYPAL_CANCEL_URL }}
          BACKEND_IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/next-ecommerce-backend:latest
          FRONTEND_IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/next-ecommerce-frontend:latest
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          GHCR_REGISTRY: ${{ env.REGISTRY }}
        run: |
          # Ghi .env trên runner (an toàn với mọi ký tự đặc biệt)
          {
            printf 'MYSQL_ROOT_PASSWORD=%s\n' "$MYSQL_ROOT_PASSWORD"
            printf 'MYSQL_DATABASE=%s\n'      "$MYSQL_DATABASE"
            printf 'MYSQL_USER=%s\n'          "$MYSQL_USER"
            printf 'MYSQL_PASSWORD=%s\n'      "$MYSQL_PASSWORD"
            printf 'JWT_SECRET=%s\n'          "$JWT_SECRET"
            printf 'JWT_EXPIRATION=%s\n'      "$JWT_EXPIRATION"
            printf 'MAIL_USERNAME=%s\n'       "$MAIL_USERNAME"
            printf 'MAIL_PASSWORD=%s\n'       "$MAIL_PASSWORD"
            printf 'NEXT_PUBLIC_API_URL=%s\n'          "$NEXT_PUBLIC_API_URL"
            printf 'NEXT_PUBLIC_PAYPAL_CLIENT_ID=%s\n' "$NEXT_PUBLIC_PAYPAL_CLIENT_ID"
            printf 'VNPAY_RETURN_URL=%s\n'    "$VNPAY_RETURN_URL"
            printf 'PAYPAL_RETURN_URL=%s\n'   "$PAYPAL_RETURN_URL"
            printf 'PAYPAL_CANCEL_URL=%s\n'   "$PAYPAL_CANCEL_URL"
            printf 'BACKEND_IMAGE=%s\n'       "$BACKEND_IMAGE"
            printf 'FRONTEND_IMAGE=%s\n'      "$FRONTEND_IMAGE"
          } > /tmp/deploy.env

          # Upload .env lên server
          scp /tmp/deploy.env ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_SSH_HOSTNAME }}:~/app/.env

          # Chạy docker deploy trên server
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_SSH_HOSTNAME }} \
            GHCR_TOKEN="$GHCR_TOKEN" GHCR_USER="$GHCR_USER" GHCR_REGISTRY="$GHCR_REGISTRY" \
            bash << 'ENDSSH'
              set -e
              cd ~/app

              echo "--- Image values in .env ---"
              grep -E "^(BACKEND|FRONTEND)_IMAGE" .env

              # Đăng nhập GHCR
              echo "$GHCR_TOKEN" | docker login "$GHCR_REGISTRY" -u "$GHCR_USER" --password-stdin

              # Pull images mới nhất từ GHCR
              docker compose -f docker-compose.prod.yml pull backend frontend

              # Khởi động lại services
              docker compose -f docker-compose.prod.yml up -d --remove-orphans

              # Kiểm tra containers
              docker compose -f docker-compose.prod.yml ps

              # Xóa images cũ
              docker image prune -af --filter "until=24h"

              echo "✅ Deployment completed successfully!"
          ENDSSH

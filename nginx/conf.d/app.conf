# ================================================================
# PHẦN 1: RATE LIMITING ZONES
# ================================================================

limit_req_zone $http_cf_connecting_ip  zone=api_shipper:10m  rate=20r/s;
limit_req_zone $http_cf_connecting_ip  zone=login_zone:10m   rate=1r/s;

log_format main '$remote_addr | xff=$http_x_forwarded_for | cf=$http_cf_connecting_ip [$time_local] '
                '"$request" $status | limit=$limit_req_status';

# ================================================================
# PHẦN 2: UPSTREAM
# ================================================================

upstream backend_cluster {
    server backend:8080;
    keepalive 32;
}

upstream frontend_cluster {
    server frontend:3000;
    keepalive 16;
}

# ================================================================
# PHẦN 3: HTTP Virtual Host (Zero Trust)
# Cloudflare Tunnel xử lý SSL và chuyển Request HTTP đến Nginx
# ================================================================
server {
    listen 80;
    server_name voipelearning.shop www.voipelearning.shop api.voipelearning.shop;

    # Cloudflare optimization: Trust Cloudflare IPs cho Tunnel
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;

    # Security Headers
    add_header X-Frame-Options        "SAMEORIGIN"          always;
    add_header X-Content-Type-Options "nosniff"             always;
    add_header X-XSS-Protection       "1; mode=block"       always;
    add_header Referrer-Policy        "strict-origin"       always;

    location /api/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://backend_cluster;
        proxy_http_version 1.1; 
        proxy_set_header   Connection "";

        proxy_set_header   Host              $host;
        # Lấy IP thực của người đăng nhập
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto https;

        proxy_connect_timeout 5s;
        proxy_read_timeout    15s;
    }

    location /api/ {
        limit_req zone=api_shipper burst=50 nodelay;
        limit_req_status 429;

        add_header Retry-After 1 always;

        proxy_pass         http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto https;

        proxy_connect_timeout  5s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;
    }

    location / {
        proxy_pass         http://frontend_cluster;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto https;

        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_connect_timeout  5s;
        proxy_read_timeout     60s;
    }

    location /nginx-health {
        access_log off;
        return 200 '{"status":"healthy"}';
        add_header Content-Type application/json;
    }

    error_page 429 @too_many_requests;
    location @too_many_requests {
        default_type application/json;
        add_header Retry-After 1 always;
        return 429 '{"error":"Quá nhiều yêu cầu. Vui lòng thử lại sau 1 giây.","code":429}';
    }

    error_page 502 503 @backend_down;
    location @backend_down {
        default_type application/json;
        return 503 '{"error":"Hệ thống đang bảo trì. Vui lòng thử lại sau.","code":503}';
    }
}

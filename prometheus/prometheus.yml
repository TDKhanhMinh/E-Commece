global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:

  # ---- Spring Boot Backend ----
  - job_name: "spring-boot-backend"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 15s
    static_configs:
      - targets: ["backend:8080"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "backend"

  # ---- Next.js Frontend (nếu có custom metrics) ----
  - job_name: "nextjs-frontend"
    metrics_path: "/api/metrics"
    static_configs:
      - targets: ["frontend:3000"]

  # ---- Nginx (qua nginx-prometheus-exporter) ----
  - job_name: "nginx"
    static_configs:
      - targets: ["nginx-exporter:9113"]

  # ---- Redis (qua redis_exporter) ----
  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  # ---- cAdvisor - Container metrics ----
  - job_name: "cadvisor"
    scrape_interval: 15s
    static_configs:
      - targets: ["cadvisor:8080"]

  # ---- Docker daemon metrics ----
  - job_name: "docker-daemon"
    static_configs:
      - targets: ["host.docker.internal:9323"]

  # ---- Prometheus tự monitor chính nó ----
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
